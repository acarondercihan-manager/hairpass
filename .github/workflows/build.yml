name: HairPass APK Derleme

on:
  push:
    branches: [ main, master, ana ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Projeyi Bul ve APK Derle
        run: |
          TARGET=$(find . -name "pubspec.yaml" | head -n 1)
          APP_DIR="${TARGET%/pubspec.yaml}"
          echo "Proje dizini: $APP_DIR"
          cd "$APP_DIR"
          mkdir -p assets/images
          flutter create . --org com.hairpass.app --platforms=android
          flutter pub get
          flutter build apk --release

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: HairPass-Android-APK
          path: "**/*.apk"
