name: HairPass APK Derleme

on:
  push:
    branches: [ main, master, ana ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v3

      - name: Java Kurulumu
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Projeyi Bul ve APK Derle
        run: |
          APP_DIR=$(dirname $(find . -name "pubspec.yaml" | head -n 1))
          echo "Proje dizini bulundu: $APP_DIR"
          cd "$APP_DIR"
          flutter pub get
          flutter build apk --release

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v3
        with:
          name: HairPass-Android-APK
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
